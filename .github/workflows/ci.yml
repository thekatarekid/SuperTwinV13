# Fast feedback on every push and pull request.
#
# Linux only and deliberately cheap: no Rust, no Tauri, no 700 MB of staged
# media. Anything that needs macOS lives in release-dmg.yml.

name: CI

on:
  # Branch pushes are covered by the pull_request trigger, so restricting push
  # to main keeps a PR'd branch from running the whole suite twice per commit.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # v5 is the first major of each that runs on node24; v4 still targets the
      # deprecated node20 and the runner was already force-running it on 24.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Unit tests
        # The root config covers src/; the scripts project is run separately
        # below because it needs the node environment, not jsdom.
        run: npx vitest run

      - name: Build script tests
        run: npx vitest run --config scripts/vitest.config.mjs

      - name: Worker tests
        run: npm test --if-present -w @supertwinv13/worker

      # The golden set is LIVE BY CONSTRUCTION (worker/src/evals/cli.ts): the
      # model-facing cases run the real pass through the real `claude` CLI and
      # are graded by the haiku judge. There is no frozen mode. A GitHub-hosted
      # runner carries no CLI, so `npm run eval` can only die on SPAWN_FAILED —
      # which is what it did the moment the script landed.
      #
      # So the gate is the toolchain, not the script: absent CLI is a skip, the
      # same posture testing/real-cli.ts and the Go daemon suites take for their
      # missing toolchains. A PRESENT CLI is never skipped, so a genuinely red
      # eval run still fails the job — on a self-hosted runner, or here the day
      # a credentialed transport is wired in.
      - name: Golden evals
        run: |
          set -euo pipefail
          if ! node -e "process.exit(require('./package.json').scripts?.eval ? 0 : 1)"; then
            echo "no 'eval' script in package.json — skipping"
            echo "No \`eval\` script in package.json yet — skipped." >> "$GITHUB_STEP_SUMMARY"
          elif ! command -v claude >/dev/null 2>&1; then
            echo "no 'claude' CLI on PATH — skipping the live golden set"
            echo "Golden evals skipped: no \`claude\` CLI on this runner (the golden set is live-by-construction)." >> "$GITHUB_STEP_SUMMARY"
          else
            npm run eval
          fi
