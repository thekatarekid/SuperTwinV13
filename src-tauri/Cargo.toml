[package]
name = "supertwinv11"
version = "0.7.0"
description = "SuperTwinV11 — private personal AI over your WhatsApp"
authors = ["SuperTwinV11"]
edition = "2021"
rust-version = "1.77.2"

# The `_lib` suffix keeps the library name distinct from the binary on
# platforms (Windows) that would otherwise collide.
[lib]
name = "supertwinv11_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
