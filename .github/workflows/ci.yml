# Fast feedback on every push and pull request.
#
# Linux only and deliberately cheap: no Rust, no Tauri, no 700 MB of staged
# media. Anything that needs macOS lives in release-dmg.yml.

name: CI

on:
  # Branch pushes are covered by the pull_request trigger, so restricting push
  # to main keeps a PR'd branch from running the whole suite twice per commit.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # v5 is the first major of each that runs on node24; v4 still targets the
      # deprecated node20 and the runner was already force-running it on 24.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Unit tests
        # The root config covers src/; the scripts project is run separately
        # below because it needs the node environment, not jsdom.
        run: npx vitest run

      - name: Build script tests
        run: npx vitest run --config scripts/vitest.config.mjs

      - name: Worker tests
        # worker/vitest.config.ts always excludes the three cost-bearing Claude
        # suites from this command, even if a runner happens to have the CLI.
        run: npm test --if-present -w @supertwinv13/worker

      # The golden set is LIVE BY CONSTRUCTION (worker/src/evals/cli.ts): the
      # model-facing cases run the real pass through the real `claude` CLI and
      # are graded by the haiku judge. There is no frozen mode.
      #
      # Live golden evals are never inferred from tool availability. They are a
      # deliberate, separately-invoked operator workflow because every run is
      # billable. CI records that boundary instead of probing for `claude`.
      - name: Golden eval boundary
        run: |
          echo "Golden evals not run: live model calls require an explicit operator invocation." \
            >> "$GITHUB_STEP_SUMMARY"
